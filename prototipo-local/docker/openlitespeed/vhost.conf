docRoot                   /var/www/core/public/
vhDomain                  teste1.local
vhAliases                 teste1.local, teste2.local, teste1.test, teste2.test
adminEmails               demo@example.invalid
enableGzip                1
enableIpGeo               0

accesslog /dev/null {
  useServer               0
}

index  {
  useServer               0
  indexFiles              index.php, index.html
}

scriptHandler  {
  add                     lsapi:lsphp php
}

extprocessor lsphp {
  type                    lsapi
  address                 uds://tmp/lshttpd/lsphp.sock
  maxConns                10
  env                     PHP_LSAPI_CHILDREN=10
  initTimeout             60
  retryTimeout            0
  persistConn             1
  path                    /usr/local/lsws/lsphp84/bin/lsphp
  backlog                 100
  instances               1
  priority                0
  mem soft limit          2047M
  mem hard limit          2047M
  proc soft limit         400
  proc hard limit         500
}

rewrite  {
  enable                  1
  autoLoadHtaccess        1
}
